<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>抖音直播评论助手</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  :root {
    --bg: #161823;            /* 抖音直播间深色背景 */
    --panel: #1f2029;         /* 面板底色 */
    --panel-2: #272833;       /* 输入框/悬浮底色 */
    --border: #2f3038;
    --text: #f0f1f5;
    --text-sub: #9aa0b0;
    --red: #fe2c55;           /* 抖音品牌红 */
    --cyan: #25f4ee;          /* 抖音品牌青 */
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Microsoft YaHei","PingFang SC",sans-serif; background:var(--bg); color:var(--text); padding:20px; }
  ::-webkit-scrollbar { width:6px; }
  ::-webkit-scrollbar-thumb { background:#3a3b45; border-radius:3px; }
  ::-webkit-scrollbar-track { background:transparent; }

  .header { text-align:center; margin-bottom:22px; }
  /* 抖音标志性红青重影标题 */
  .header h1 { font-size:26px; letter-spacing:2px; color:#fff;
    text-shadow:-2px 0 var(--cyan), 2px 0 var(--red); }

  .capture-bar { display:flex; gap:10px; align-items:center; background:var(--panel);
    border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:20px; }
  .capture-bar input { flex:1; padding:10px 14px; background:var(--panel-2); color:var(--text);
    border:1px solid var(--border); border-radius:20px; font-size:14px; }
  .capture-bar input::placeholder { color:#5c6170; }
  .capture-bar input:focus { outline:none; border-color:var(--cyan); }
  .capture-bar button { padding:10px 22px; border:none; border-radius:20px; cursor:pointer;
    font-size:14px; color:#fff; font-weight:bold; }
  .capture-bar .btn-start { background:linear-gradient(90deg, var(--red), #ff5c7a); }
  .capture-bar .btn-start:hover { filter:brightness(1.12); }
  .capture-bar .btn-stop { background:#3a3b45; color:#c9ccd6; }
  .capture-bar .btn-stop:hover { background:#4a4b55; color:#fff; }
  .capture-bar .status { font-size:14px; color:var(--text-sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:280px; }
  /* 「直播中」红点闪烁，仿抖音直播间状态 */
  .capture-bar .status.running { color:var(--red); font-weight:bold; }
  .capture-bar .status.running::before { content:''; display:inline-block; width:8px; height:8px;
    border-radius:50%; background:var(--red); margin-right:6px; animation:blink 1.2s infinite; }
  @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:.25; } }

  .cards { display:flex; gap:16px; margin-bottom:20px; }
  .card { flex:1; background:var(--panel); border:1px solid var(--border); border-radius:12px;
    padding:20px; text-align:center; }
  .card .num { font-size:34px; font-weight:bold;
    background:linear-gradient(90deg, var(--cyan), var(--red));
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .card .label { color:var(--text-sub); margin-top:6px; font-size:13px; }

  .row { display:flex; gap:16px; margin-bottom:20px; }
  .panel { flex:1; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px; }
  .panel h3 { margin-bottom:12px; color:var(--text); font-size:16px; padding-left:10px;
    border-left:3px solid var(--red); line-height:1.2; }

  #timeline { height:260px; }
  #topusers { height:260px; }

  /* 弹幕式评论区 */
  .comments { max-height:300px; overflow-y:auto; }
  .comments div { display:flex; align-items:flex-start; gap:8px; padding:7px 8px; border-radius:8px; font-size:14px; line-height:1.5; }
  .comments div:hover { background:var(--panel-2); }
  .comments .avatar { flex-shrink:0; width:26px; height:26px; border-radius:50%; color:#161823;
    font-size:13px; font-weight:bold; display:flex; align-items:center; justify-content:center; margin-top:1px; }
  .comments .user { font-weight:bold; }
  .comments .content { color:var(--text); word-break:break-all; }
  .comments .time { color:#5c6170; font-size:11px; margin-left:auto; flex-shrink:0; margin-top:4px; }

  .qa { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px; }
  .qa h3 { font-size:16px; padding-left:10px; border-left:3px solid var(--red); line-height:1.2; margin-bottom:12px; }
  .qa textarea { width:100%; height:60px; padding:10px 14px; background:var(--panel-2); color:var(--text);
    border:1px solid var(--border); border-radius:10px; resize:none; font-size:14px; }
  .qa textarea::placeholder { color:#5c6170; }
  .qa textarea:focus { outline:none; border-color:var(--cyan); }
  .qa button { margin-top:10px; padding:9px 28px; background:linear-gradient(90deg, var(--red), #ff5c7a);
    color:#fff; border:none; border-radius:20px; cursor:pointer; font-size:14px; font-weight:bold; }
  .qa button:hover { filter:brightness(1.12); }
  .qa .answer { margin-top:12px; padding:12px 14px; background:var(--panel-2); border-radius:10px;
    white-space:pre-wrap; min-height:40px; line-height:1.7; font-size:14px; color:#d5d8e0; }
</style>
</head>
<body>
<div class="header"><h1>抖音直播评论助手</h1></div>

<!-- F04：直播页 URL 动态输入与采集控制 -->
<div class="capture-bar">
  <input id="liveUrl" type="text" placeholder="输入抖音直播页 URL，如 https://live.douyin.com/房间号">
  <button class="btn-start" onclick="startCapture()">开始采集</button>
  <button class="btn-stop" onclick="stopCapture()">停止采集</button>
  <span class="status" id="captureStatus">未启动</span>
</div>

<div class="cards">
  <div class="card"><div class="num" id="total">0</div><div class="label">评论总数</div></div>
  <div class="card"><div class="num" id="users">0</div><div class="label">发言人数</div></div>
</div>

<div class="row">
  <div class="panel"><h3>评论趋势</h3><div id="timeline"></div></div>
  <div class="panel"><h3>活跃用户 TOP10</h3><div id="topusers"></div></div>
</div>

<div class="row">
  <div class="panel"><h3>最新评论</h3><div class="comments" id="comments"></div></div>
</div>

<div class="qa">
  <h3>智能问答</h3>
  <textarea id="question" placeholder="例如：观众最关心什么问题？有哪些负面评价？"></textarea>
  <button onclick="askQuestion()">提问</button>
  <div class="answer" id="answer">输入问题后，AI 将基于已采集的评论进行分析回答。</div>
</div>

<script>
const timelineChart = echarts.init(document.getElementById('timeline'));
const topChart = echarts.init(document.getElementById('topusers'));

// 深色主题图表通用配置
const AXIS_TEXT = '#9aa0b0';
const SPLIT_LINE = '#2a2b36';
const TOOLTIP_DARK = { backgroundColor:'#272833', borderColor:'#2f3038', textStyle:{ color:'#f0f1f5' } };

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, m =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// 弹幕用户名配色：同一用户颜色稳定，仿直播间评论色彩
const USER_COLORS = ['#25f4ee','#ffd041','#ff6699','#70e07b','#7aa2ff','#fe2c55'];
function userColor(name) {
  let h = 0;
  for (const ch of (name || '')) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return USER_COLORS[h % USER_COLORS.length];
}

async function refresh() {
  const [comments, stats] = await Promise.all([
    fetch('/api/comments').then(r => r.json()),
    fetch('/api/stats').then(r => r.json())
  ]);
  document.getElementById('total').textContent = stats.total;
  document.getElementById('users').textContent = stats.unique_users;

  timelineChart.setOption({
    tooltip: { trigger: 'axis', ...TOOLTIP_DARK },
    grid: { left: 40, right: 16, top: 20, bottom: 55 },
    xAxis: { type: 'category', data: stats.timeline.map(t => t.time),
      axisLabel: { rotate: 45, color: AXIS_TEXT }, axisLine: { lineStyle: { color: SPLIT_LINE } } },
    yAxis: { type: 'value', axisLabel: { color: AXIS_TEXT }, splitLine: { lineStyle: { color: SPLIT_LINE } } },
    series: [{ type: 'line', smooth: true, data: stats.timeline.map(t => t.count),
      itemStyle: { color: '#fe2c55' }, lineStyle: { width: 2.5, color: '#fe2c55' },
      areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
        { offset: 0, color: 'rgba(254,44,85,.35)' },
        { offset: 1, color: 'rgba(254,44,85,0)' }]) } }]
  });

  topChart.setOption({
    tooltip: { ...TOOLTIP_DARK },
    grid: { left: 90, right: 30, top: 10, bottom: 20 },
    xAxis: { type: 'value', axisLabel: { color: AXIS_TEXT }, splitLine: { lineStyle: { color: SPLIT_LINE } } },
    yAxis: { type: 'category', data: stats.top_users.map(u => u.name),
      axisLabel: { color: AXIS_TEXT }, axisLine: { lineStyle: { color: SPLIT_LINE } } },
    series: [{ type: 'bar', data: stats.top_users.map(u => u.count), barWidth: 14,
      itemStyle: { borderRadius: [0, 7, 7, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#25f4ee' },
          { offset: 1, color: '#fe2c55' }]) } }]
  });

  const box = document.getElementById('comments');
  box.innerHTML = comments.map(c => {
    const color = userColor(c.username);
    const initial = esc((c.username || '?').charAt(0).toUpperCase());
    return `<div>` +
      `<span class="avatar" style="background:${color}">${initial}</span>` +
      `<span><span class="user" style="color:${color}">${esc(c.username)}</span>` +
      `: <span class="content">${esc(c.content)}</span></span>` +
      `<span class="time">${esc(c.captured_at)}</span>` +
      `</div>`;
  }).join('');
}

async function askQuestion() {
  const q = document.getElementById('question').value.trim();
  if (!q) return;
  document.getElementById('answer').textContent = '思考中...';
  const res = await fetch('/api/ask', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ question: q })
  }).then(r => r.json());
  document.getElementById('answer').textContent = res.answer;
}

// F04：采集控制
function renderCaptureStatus(st) {
  const el = document.getElementById('captureStatus');
  if (st.running) {
    el.textContent = '采集中：' + st.url;
    el.classList.add('running');
  } else {
    el.textContent = st.url ? '已停止（上次：' + st.url + '）' : '未启动';
    el.classList.remove('running');
  }
  if (st.url && !document.getElementById('liveUrl').value) {
    document.getElementById('liveUrl').value = st.url;
  }
}

async function startCapture() {
  const url = document.getElementById('liveUrl').value.trim();
  const res = await fetch('/api/capture/start', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ url: url })
  });
  const data = await res.json();
  if (!res.ok) {
    alert(data.error || '启动失败');
    return;
  }
  renderCaptureStatus(data);
}

async function stopCapture() {
  const res = await fetch('/api/capture/stop', { method: 'POST' });
  renderCaptureStatus(await res.json());
}

async function refreshStatus() {
  const st = await fetch('/api/capture/status').then(r => r.json());
  renderCaptureStatus(st);
}

refreshStatus();
refresh();
setInterval(refresh, 5000);
setInterval(refreshStatus, 5000);
</script>
</body>
</html>
